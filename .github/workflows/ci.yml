name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: self-hosted
    defaults:
      run:
        shell: arch -arm64 bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      # ── C++ ──────────────────────────────────────────────
      - name: Build C++ library and interop tools
        run: |
          rm -rf build && mkdir build && cd build
          cmake ..
          cmake --build . -j$(nproc)

      # ── Dart ─────────────────────────────────────────────
      - name: Dart pub get
        working-directory: dart
        run: dart pub get

      - name: Dart code generation
        working-directory: dart
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Dart analyze
        working-directory: dart
        run: dart analyze --no-fatal-warnings

      # ── Python ───────────────────────────────────────────
      - name: Install Python package
        run: pip install --break-system-packages -e python/

      - name: Verify Python imports
        run: python3 -c "from raccoon_transport import Transport, Channels; print('OK')"

      # ── Integration tests ────────────────────────────────
      - name: Run integration tests
        run: PYTHONPATH=. python3 -m pytest integration_tests/ -v
