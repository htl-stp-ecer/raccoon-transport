name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VERSION: "0.1.${{ github.run_number }}"

jobs:
  build-and-test:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      # ── C++ ──────────────────────────────────────────────
      - name: Build C++ library and interop tools
        run: |
          rm -rf build && mkdir build && cd build
          if [[ "$(uname -s)" == "Darwin" ]]; then
            cmake -DCMAKE_OSX_ARCHITECTURES="$(uname -m)" ..
          else
            cmake ..
          fi
          cmake --build . -j$(nproc)

      - name: Run C++ unit tests
        run: ctest --test-dir build --output-on-failure

      # ── Dart ─────────────────────────────────────────────
      - name: Dart pub get
        working-directory: dart
        run: dart pub get

      - name: Dart code generation
        working-directory: dart
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Dart analyze
        working-directory: dart
        run: dart analyze --no-fatal-warnings

      - name: Dart unit tests
        working-directory: dart
        run: dart test test/transport_unit_test.dart

      # ── Python ───────────────────────────────────────────
      - name: Install Python package
        run: pip3 install --break-system-packages -e python/ pytest

      - name: Verify Python imports
        run: python3 -c "from raccoon_transport import Transport, Channels; print('OK')"

      - name: Python unit tests
        run: python3 -m pytest python/tests/ -v

      # ── Integration tests ────────────────────────────────
      - name: Run integration tests
        run: PYTHONPATH=. python3 -m pytest integration_tests/ -v

  build-and-release:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    permissions:
      contents: write
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      - uses: actions/checkout@v4

      - name: Patch version
        run: |
          python3 -c "import pathlib, re; f=pathlib.Path('python/pyproject.toml'); f.write_text(re.sub(r'^version = \".*\"', 'version = \"${{ env.VERSION }}\"', f.read_text(), flags=re.MULTILINE))"

      - name: Build wheel
        run: |
          pip3 install --break-system-packages build
          rm -rf python/dist
          cd python && python3 -m build --wheel

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: python/dist/raccoon_transport-*.whl

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: raccoon-transport-wheel
          path: python/dist/raccoon_transport-*.whl

  publish-pypi:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: raccoon-transport-wheel
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
