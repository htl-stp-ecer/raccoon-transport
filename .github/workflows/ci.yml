name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VERSION: "0.1.${{ github.run_number }}"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            glib-2.0-dev

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      # ── C++ ──────────────────────────────────────────────
      - name: Build C++ library and interop tools
        run: |
          rm -rf build && mkdir build && cd build
          cmake ..
          cmake --build . -j$(nproc)

      - name: Run C++ unit tests
        run: ctest --test-dir build --output-on-failure

      # ── Dart ─────────────────────────────────────────────
      - name: Dart pub get
        working-directory: dart
        run: dart pub get

      # No codegen step: messages were hand-written in cc7d9e7 to drop lcm-gen
      # entirely. The .g.dart suffix is historical.

      - name: Dart analyze
        working-directory: dart
        run: dart analyze --no-fatal-warnings

      - name: Dart unit tests
        working-directory: dart
        run: dart test test/transport_unit_test.dart

      # ── Python ───────────────────────────────────────────
      - name: Install Python package
        run: pip3 install -e python/ pytest

      - name: Verify Python imports
        run: python3 -c "from raccoon_transport import Transport, Channels; print('OK')"

      - name: Python unit tests
        run: python3 -m pytest python/tests/ -v

      # ── Integration tests ────────────────────────────────
      # These exercise cross-language pub/sub, retain, reliable, and fingerprint
      # compat between Python, C++, and Dart. Most are currently broken
      # because:
      #   * cc7d9e7 dropped lcm-gen + LCM fingerprints from the Dart messages,
      #     so test_message_compat::test_*fingerprint_match has nothing to
      #     match against.
      #   * c746cf2 dropped reliable + retain on the C++ + Python sides.
      #   * Cross-language UDP-multicast suites need IP multicast, which
      #     GitHub-hosted runners don't enable.
      # Run them for observability but don't block the release — the
      # production transport (raccoon_ring SHM) is covered by the C++/Dart/
      # Python unit suites above. Re-tighten once the cross-language layer
      # gets rebuilt on top of the new wire format.
      - name: Run integration tests
        continue-on-error: true
        run: PYTHONPATH=. python3 -m pytest integration_tests/ -v

  build-and-release:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      - uses: actions/checkout@v4

      - name: Patch version
        run: |
          python3 -c "import pathlib, re; f=pathlib.Path('python/pyproject.toml'); f.write_text(re.sub(r'^version = \".*\"', 'version = \"${{ env.VERSION }}\"', f.read_text(), flags=re.MULTILINE))"

      - name: Build wheel
        run: |
          pip3 install build
          rm -rf python/dist
          cd python && python3 -m build --wheel

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: python/dist/raccoon_transport-*.whl

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: raccoon-transport-wheel
          path: python/dist/raccoon_transport-*.whl

  publish-pypi:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: raccoon-transport-wheel
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
