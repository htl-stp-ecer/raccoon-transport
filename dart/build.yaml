builders:
  lcm:
    import: "package:raccoon_transport/builder.dart"
    builder_factories: ["lcmBuilder"]
    build_extensions: {".lcm": [".g.dart"]}
    auto_apply: dependents
    build_to: source
    applies_builders: ["source_gen|combining_builder"]

targets:
  $default:
    builders:
      raccoon_transport|lcm:
        enabled: true
