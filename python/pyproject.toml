[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raccoon-transport"
version = "0.1.0"
description = "Shared LCM transport library with channel definitions and optional reliable delivery"
license = { text = "MIT" }
authors = [{ name = "Tobias Madlberger" }]
keywords = ["botball", "robotics", "lcm", "transport", "raspberry-pi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
]
requires-python = ">=3.8"
dependencies = ["lcm"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["raccoon_transport*"]
